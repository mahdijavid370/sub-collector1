name: Auto Update Subscription Configs

on:
  push:
    branches:
      - arena/f6a69f1a-sub-collector1
  schedule:
    # Every four hours at :17 UTC (avoids the busy start of the hour).
    - cron: '17 */4 * * *'
  workflow_dispatch:

# Scheduled and manually triggered runs must not race to update the same branch.
concurrency:
  group: subscription-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-previous-failure:
    if: github.ref == 'refs/heads/arena/f6a69f1a-sub-collector1'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Classify previous failure without exposing its log
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh run view 41024261844 --job 123958524202 --log-failed > "$RUNNER_TEMP/previous-failure.log" 2>/dev/null; then
            echo '::error title=Diagnostic unavailable::Could not retrieve the previous run log.'
            exit 1
          fi
          python - "$RUNNER_TEMP/previous-failure.log" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          lines = [re.sub(r'^.*?\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z\s*', '', line).strip() for line in text.splitlines()]
          curl_errors = [re.search(r'curl: \((\d+)\)', line) for line in lines if 'curl: (' in line]
          if any(line == 'Xray rejected the generated configuration; nothing will be committed.' for line in lines):
              reason = 'xray_configuration_rejected'
          elif any('caution: filename not matched' in line for line in lines):
              reason = 'xray_archive_missing_expected_files'
          elif curl_errors and curl_errors[0]:
              reason = 'xray_download_curl_error_' + curl_errors[0].group(1)
          elif any('sha256sum:' in line or 'checksum' in line.lower() and 'failed' in line.lower() for line in lines):
              reason = 'xray_checksum_failed'
          else:
              reason = 'unclassified_validation_failure'
          print('::notice title=Previous validation failure::' + reason)
          PY

  build-and-update:
    if: github.ref != 'refs/heads/arena/f6a69f1a-sub-collector1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect subscriptions
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: python collector.py

      - name: Validate generated Xray configuration
        shell: bash
        env:
          XRAY_VERSION: 'v26.10.29'
          XRAY_SHA256: '8a5f3e6a1057e4bd0f8a7c57c9d91204b4be0b74222a6e210d070603101163c2'
        run: |
          archive="$RUNNER_TEMP/xray.zip"
          assets="$RUNNER_TEMP/xray"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/Xray-linux-64.zip" \
            -o "$archive"
          echo "$XRAY_SHA256  $archive" | sha256sum --check --status
          mkdir -p "$assets"
          unzip -q "$archive" xray geoip.dat geosite.dat -d "$assets"
          # Validation errors can contain node credentials; do not print the log.
          if ! XRAY_LOCATION_ASSET="$assets" "$assets/xray" run -test -format json -c final_sub.txt > "$RUNNER_TEMP/xray-validation.log" 2>&1; then
            echo "Xray rejected the generated configuration; nothing will be committed."
            exit 1
          fi
          echo "Xray configuration is valid."

      - name: Test Xray routing and local speed measurement
        env:
          XRAY_BINARY: ${{ runner.temp }}/xray/xray
          XRAY_LOCATION_ASSET: ${{ runner.temp }}/xray
        run: python -m unittest discover -s tests -p 'test_xray_runtime.py' -v

      - name: Commit and push changed output
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Subscription updates require a branch, not a tag."
            exit 1
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- javidsub final_sub.txt json_configs/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Auto-update configs [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push origin "HEAD:$GITHUB_REF"
