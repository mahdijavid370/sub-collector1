name: Auto Update Subscription Configs

on:
  schedule:
    # اجرا هر ۴ ساعت یک بار (دقیقه ۰ ساعت‌های ۰, ۶, ۱۲, ۱۸ UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # امکان اجرای دستی در هر زمان

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Collector Script
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: python collector.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add javidsub final_sub.txt json_configs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update configs [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
