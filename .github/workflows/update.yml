name: Auto Update Subscription Configs

on:
  # Temporary branch-only trigger for an end-to-end workflow test.
  push:
    branches:
      - arena/f6a69f1a-sub-collector1
  schedule:
    # Every four hours at :17 UTC (avoids the busy start of the hour).
    - cron: '17 */4 * * *'
  workflow_dispatch:

# Scheduled and manually triggered runs must not race to update the same branch.
concurrency:
  group: subscription-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-runtime-failure:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Classify previous runtime test failure without printing logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh run view 41030893557 --job 123980099808 --log-failed > "$RUNNER_TEMP/failed-tests.log" 2>/dev/null; then
            echo '::error::Could not retrieve the test log.'
            exit 1
          fi
          python - "$RUNNER_TEMP/failed-tests.log" <<'PYCODE'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors='replace')
          names = [
              'test_delayed_response_survives_client_half_close',
              'test_https_speed_test_through_real_vless_tunnel_verifies_tls',
              'test_local_speed_test_selects_faster_tunnel_and_outputs_valid_xray_profile',
              'test_runtime_balancer_startup_latency_failover_and_recovery',
              'test_subscription_txt_validates_via_stdin_and_invalid_json_is_rejected',
              'setUpClass',
          ]
          for name in names:
              if re.search(r'\b' + name + r'\b[^\n]*\.\.\. (?:FAIL|ERROR)\b', text):
                  print('::notice title=Failed runtime test::' + name)
          lines = sorted({int(n) for n in re.findall(r'test_xray_runtime\.py", line (\d+)', text)})
          print('::notice title=Runtime test stack lines::' + ','.join(map(str, lines)))
          errors = [key for key in ('AssertionError', 'CalledProcessError', 'TimeoutExpired', 'TimeoutError', 'ConnectionResetError', 'BrokenPipeError', 'ConnectionRefusedError', 'OSError') if key in text]
          print('::notice title=Error types::' + ','.join(errors))
          phrases = {
              'xray_test_server_startup': 'The local test Xray instance exited during startup',
              'xray_listener_timeout': 'The local test Xray listener did not start',
              'xray_stdin_invalid': 'Xray rejected valid JSON from stdin',
              'xray_stdin_false_positive': 'Xray accepted invalid JSON from stdin',
              'xray_optimized_profile_invalid': 'Xray rejected the optimized profile',
              'speedtest_no_success': 'No node completed the download test',
              'speedtest_xray_failed': 'Xray exited before the benchmark could start',
              'curl_tls_error': 'CERTIFICATE_VERIFY_FAILED',
          }
          print('::notice title=Known causes::' + ','.join(key for key, phrase in phrases.items() if phrase in text))
          PYCODE

  build-and-update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect subscriptions
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: python collector.py

      - name: Validate generated Xray configuration
        shell: bash
        env:
          XRAY_VERSION: 'v26.10.29'
          XRAY_SHA256: '8a5f3e6a1057e4bd0f8a7c57c9d91204b4be0b74222a6e210d070603101163c2'
        run: |
          archive="$RUNNER_TEMP/xray.zip"
          assets="$RUNNER_TEMP/xray"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/Xray-linux-64.zip" \
            -o "$archive"
          echo "$XRAY_SHA256  $archive" | sha256sum --check --status
          mkdir -p "$assets"
          unzip -q "$archive" xray geoip.dat geosite.dat -d "$assets"
          # Xray v26.10.29 rejects regular .txt files even with -format json.
          # Feed the existing subscription file via stdin, preserving its public name.
          # Validation errors can contain node credentials; do not print the log.
          if ! XRAY_LOCATION_ASSET="$assets" "$assets/xray" run -test -format json -c stdin: < final_sub.txt > "$RUNNER_TEMP/xray-validation.log" 2>&1; then
            echo "Xray rejected the generated configuration; nothing will be committed."
            exit 1
          fi
          echo "Xray configuration is valid."

      - name: Test Xray routing and local speed measurement
        env:
          XRAY_BINARY: ${{ runner.temp }}/xray/xray
          XRAY_LOCATION_ASSET: ${{ runner.temp }}/xray
        run: python -m unittest discover -s tests -p 'test_xray_runtime.py' -v

      - name: Commit and push changed output
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Subscription updates require a branch, not a tag."
            exit 1
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- javidsub final_sub.txt json_configs/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Auto-update configs [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push origin "HEAD:$GITHUB_REF"
